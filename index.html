<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<title>
ข้อมูลที่ทำการไปรษณีย์ Rollout
</title>

<link
rel="stylesheet"
href="css/style.css"
>

</head>

<body>

<h2>
ข้อมูลที่ทำการไปรษณีย์ Rollout
</h2>

<div class="top-bar">

<input
type="text"
id="searchBox"
placeholder="ค้นหา..."
>

<button id="clearButton">
ล้างค่า
</button>

</div>

<div id="resultCount">
กำลังโหลดข้อมูล...
</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>OutletCode</th>
<th>PostOfficeName</th>
<th>Province</th>
<th>GroupID</th>
</tr>

<tr class="filter-row">

<th>
<select id="filterOutlet">
<option value="">ทั้งหมด</option>
</select>
</th>

<th>
<select id="filterPost">
<option value="">ทั้งหมด</option>
</select>
</th>

<th>
<select id="filterProvince">
<option value="">ทั้งหมด</option>
</select>
</th>

<th>
<select id="filterGroup">
<option value="">ทั้งหมด</option>
</select>
</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script src="js/app.js"></script>

</body>

</html>
